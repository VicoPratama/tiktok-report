<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TikTok Report</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg-page: #f8fafc;
  --surface: #ffffff;
  --fg: #111827;
  --fg-muted: #6b7280;
  --fg-subtle: #9ca3af;
  --border: #e5e7eb;
  --border-light: #f3f4f6;
  --surface-hover: #f9fafb;
  --status-green: #10b981;
  --status-green-bg: #ecfdf5;
  --status-green-border: #a7f3d0;
  --status-green-text: #047857;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.02);
  --shadow-popover: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-page);
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

button, input, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

/* Minimal Top Header matching reference */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: flex;
  align-items: center;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-hamburger {
  display: flex;
  flex-direction: column;
  gap: 3.5px;
  width: 16px;
}

.header-hamburger span {
  display: block;
  height: 2px;
  background-color: #374151;
  border-radius: 1px;
}

.header-divider {
  width: 1px;
  height: 18px;
  background-color: var(--border);
}

.header-title {
  font-weight: 700;
  font-size: 15px;
  color: var(--fg);
  letter-spacing: -0.01em;
}

/* Main Container */
main {
  max-width: 1180px;
  margin: 24px auto;
  padding: 0 16px 48px;
}

/* Main Large SaaS Card */
.report-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 30px;
  box-shadow: var(--shadow-card);
}

/* Top Section (Title + Status + Refresh) */
.report-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.title-group h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg);
}

.title-group p {
  color: var(--fg-muted);
  font-size: 13.5px;
  margin-top: 3px;
}

.status-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.status-live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--status-green-bg);
  border: 1px solid var(--status-green-border);
  color: var(--status-green-text);
  font-size: 12.5px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 999px;
}

.status-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--status-green);
}

.last-updated-text {
  color: var(--fg-muted);
  font-size: 12.5px;
}

.btn-refresh {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.15s ease;
}

.btn-refresh:hover {
  background: var(--surface-hover);
}

.btn-refresh svg.spin {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Connected Accounts Row (2 Columns) */
.accounts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}

@media (max-width: 680px) {
  .accounts-grid {
    grid-template-columns: 1fr;
  }
}

.account-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
}

.account-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  overflow: hidden;
  background-color: #e5e7eb;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.account-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.account-meta {
  line-height: 1.3;
}

.account-handle {
  font-weight: 700;
  font-size: 14.5px;
  color: var(--fg);
}

.account-status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 2px;
}

.account-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--status-green);
}

/* Summary Metrics (4 Cards) */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}

@media (max-width: 860px) {
  .summary-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .summary-grid {
    grid-template-columns: 1fr;
  }
}

.summary-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 14px;
}

.summary-icon-box {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--border-light);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #374151;
  flex-shrink: 0;
}

.summary-details {
  line-height: 1.25;
}

.summary-label {
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 4px;
}

.summary-value {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg);
}

/* Filter Bar */
.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-light);
}

.filter-left-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-right-group {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.filter-btn-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  color: #374151;
  transition: all 0.15s ease;
}

.filter-btn-pill:hover {
  background: var(--surface-hover);
  border-color: #d1d5db;
}

.filter-btn-pill .filter-name {
  font-weight: 600;
  color: var(--fg);
}

.filter-btn-pill .filter-val {
  color: var(--fg-muted);
}

.filter-btn-pill .chevron {
  font-size: 10px;
  color: var(--fg-subtle);
  margin-left: 2px;
}

.btn-clear-filters {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--fg-muted);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
}

.btn-clear-filters:hover {
  color: var(--fg);
  text-decoration: underline;
}

.btn-export {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--fg);
  transition: all 0.15s ease;
}

.btn-export:hover {
  background: var(--surface-hover);
}

.export-container {
  position: relative;
}

.export-dropdown {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popover);
  padding: 6px 0;
  min-width: 220px;
  z-index: 200;
}

.export-dropdown button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 14px;
  text-align: left;
  font-size: 12.5px;
  color: var(--fg);
  transition: background 0.1s ease;
}

.export-dropdown button:hover {
  background: var(--surface-hover);
}

/* Active Filter Chips */
.chips-container {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  color: #334155;
  font-weight: 500;
}

.filter-chip button {
  font-size: 13px;
  line-height: 1;
  color: #64748b;
  display: flex;
  align-items: center;
  justify-content: center;
}

.filter-chip button:hover {
  color: #0f172a;
}

/* Table Architecture */
.table-container {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 13px;
}

/* Column Width Percentages for Compact Layout */
col.col-date { width: 14%; }
col.col-page { width: 20%; }
col.col-song { width: 16%; }
col.col-views { width: 13%; }
col.col-shares { width: 12%; }
col.col-saves { width: 12%; }
col.col-content { width: 13%; }

thead {
  background-color: #fafbfc;
  border-bottom: 1px solid var(--border);
}

th {
  padding: 10px 14px;
  font-size: 11.5px;
  font-weight: 600;
  color: #64748b;
  letter-spacing: 0.04em;
  text-align: left;
  user-select: none;
  white-space: nowrap;
}

th.num {
  text-align: right;
}

th.center {
  text-align: center;
}

.th-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: inherit;
  color: inherit;
  letter-spacing: inherit;
  width: 100%;
}

th.num .th-btn {
  justify-content: flex-end;
}

.th-btn:hover {
  color: var(--fg);
}

.th-btn.active {
  color: var(--fg);
}

tbody tr {
  border-bottom: 1px solid var(--border-light);
  transition: background-color 0.12s ease;
}

tbody tr:last-child {
  border-bottom: none;
}

tbody tr:hover {
  background-color: var(--surface-hover);
}

td {
  padding: 12px 14px;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: middle;
}

td.td-date {
  color: #4b5563;
  font-variant-numeric: tabular-nums;
}

td.td-page {
  font-weight: 500;
  color: var(--fg);
}

td.td-song {
  color: #4b5563;
}

td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

td.center {
  text-align: center;
}

.btn-view-post {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--fg);
  font-size: 12px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.15s ease;
}

.btn-view-post:hover {
  background: var(--surface-hover);
  border-color: #d1d5db;
}

/* Pagination Bar */
.pagination-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  font-size: 12.5px;
  color: var(--fg-muted);
  flex-wrap: wrap;
  gap: 12px;
}

.pagination-pages {
  display: flex;
  align-items: center;
  gap: 4px;
}

.page-num-btn {
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--fg-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s ease;
}

.page-num-btn:hover:not(:disabled) {
  background: var(--surface-hover);
  color: var(--fg);
}

.page-num-btn.active {
  background: #f1f5f9;
  border-color: #cbd5e1;
  color: var(--fg);
  font-weight: 600;
}

.page-num-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.page-ellipsis {
  padding: 0 4px;
  color: var(--fg-subtle);
}

/* Popover for Column Filters & Sorting */
.popover {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popover);
  padding: 10px;
  min-width: 210px;
  z-index: 250;
}

.popover-header {
  font-size: 11px;
  font-weight: 700;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  padding: 0 4px;
}

.pop-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 8px;
  font-size: 12.5px;
  border-radius: 4px;
  text-align: left;
  color: var(--fg);
}

.pop-btn:hover {
  background: var(--surface-hover);
}

.pop-btn.selected {
  font-weight: 600;
  background: #f1f5f9;
}

.popover hr {
  border: none;
  border-top: 1px solid var(--border-light);
  margin: 6px 0;
}

.popover-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
}

.popover-row input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 12px;
}

.popover-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 8px;
}

.pop-apply-btn {
  background: var(--fg);
  color: white;
  padding: 4px 10px;
  font-size: 11.5px;
  font-weight: 500;
  border-radius: 4px;
}

.pop-clear-btn {
  background: #f1f5f9;
  color: #475569;
  padding: 4px 8px;
  font-size: 11.5px;
  font-weight: 500;
  border-radius: 4px;
}

/* Toast Message */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: white;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: toastIn 0.2s ease-out;
}

@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
</style>
</head>

    </div>

    <div class="header-title">Report</div>
  </div>
</header>

<main>

</main>

const fmt = n => (n == null || n === '') ? '0' : Number(n).toLocaleString('en-US');
const fd = iso => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  const date = new Date(Date.UTC(+y, +m - 1, +d));
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

async function fetchAccounts() {
  try {
    const res = await fetch(CONFIG.apiBase + '/accounts');
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) return data;
    }
  } catch (e) {}
  return S.accounts;
}

async function fetchPosts() {
  try {
    const res = await fetch(CONFIG.apiBase + '/posts');
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) return data;
    }
  } catch (e) {}
  return INITIAL_POSTS;
}

async function triggerRefresh() {
  try {
    await fetch(CONFIG.apiBase + '/refresh', { method: 'POST' });
  } catch (e) {}
  const [accounts, posts] = await Promise.all([fetchAccounts(), fetchPosts()]);
  return { accounts, posts, at: new Date() };
}

function getFilteredRows() {
  const f = S.f;
  return S.posts.filter(p => {
    if (f.from && p.date < f.from) return false;
    if (f.to && p.date > f.to) return false;
    if (f.page && p.page !== f.page) return false;
    if (f.song && p.song !== f.song) return false;
    for (const k of NUM_COLS) {
      const [min, max] = f.rng[k];
      const val = p[k] ?? 0;
      if (min != null && val < min) return false;
      if (max != null && val > max) return false;
    }
    return true;
  });
}

function getSortedRows(rows) {
  const { key, dir } = S.sort;
  const m = dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const va = a[key];
    const vb = b[key];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'number' && typeof vb === 'number') {
      return (va - vb) * m;
    }
    return String(va).localeCompare(String(vb)) * m;
  });
}

function getFormattedTime() {
  const d = S.at || new Date();
  const dStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const tStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  return `${dStr}, ${tStr}`;
}

function getActiveFilterChips() {
  const f = S.f;
  const chips = [];
  if (f.from || f.to) {
    let label = 'Date: ';
    if (f.from && f.to && f.from === f.to) {
      label += fd(f.from);
    } else {
      label += `${f.from ? fd(f.from) : 'start'} – ${f.to ? fd(f.to) : 'latest'}`;
    }
    chips.push([label, () => { f.from = ''; f.to = ''; }]);
  }
  if (f.page) {
    chips.push([`Page: ${f.page}`, () => { f.page = ''; }]);
  }
  if (f.song) {
    chips.push([`Song: ${f.song}`, () => { f.song = ''; }]);
  }
  NUM_COLS.forEach(k => {
    const [min, max] = f.rng[k];
    if (min != null || max != null) {
      const cap = k.charAt(0).toUpperCase() + k.slice(1);
      const minStr = min != null ? fmt(min) : '0';
      const maxStr = max != null ? fmt(max) : 'any';
      chips.push([`${cap}: ${minStr} – ${maxStr}`, () => { f.rng[k] = [null, null]; }]);
    }
  });
  return chips;
}

function renderPaginationButtons(current, total) {
  const btns = [];
  if (total <= 7) {
    for (let i = 1; i <= total; i++) {
      btns.push(`<button class="page-num-btn ${current === i ? 'active' : ''}" data-action="go-page" data-page="${i}">${i}</button>`);
    }
  } else {
    for (let i = 1; i <= Math.min(5, total); i++) {
      btns.push(`<button class="page-num-btn ${current === i ? 'active' : ''}" data-action="go-page" data-page="${i}">${i}</button>`);
    }
    if (total > 6) {
      btns.push(`<span class="page-ellipsis">...</span>`);
      btns.push(`<button class="page-num-btn ${current === total ? 'active' : ''}" data-action="go-page" data-page="${total}">${total}</button>`);
    }
  }
  return btns.join('');
}

      ${S.accounts.map(a => `
        <button class="pop-btn ${f.page === a.handle ? 'selected' : ''}" data-action="pick-page" data-val="${esc(a.handle)}">${esc(a.handle)}</button>
      `).join('')}
    `;
  } else if (col === 'song') {
    const songs = [...new Set(S.posts.map(p => p.song).filter(Boolean))].sort();
    html = `
      <div class="popover-header">Filter by Song</div>
      <button class="pop-btn" data-action="sort-col" data-col="song" data-dir="asc">↑ Sort A → Z</button>
      <button class="pop-btn" data-action="sort-col" data-col="song" data-dir="desc">↓ Sort Z → A</button>
      <hr>
      <button class="pop-btn ${!f.song ? 'selected' : ''}" data-action="pick-song" data-val="">All songs</button>
      ${songs.map(s => `
        <button class="pop-btn ${f.song === s ? 'selected' : ''}" data-action="pick-song" data-val="${esc(s)}">${esc(s)}</button>
      `).join('')}
    `;
  } else if (isNum) {
    const [min, max] = f.rng[col];
    const cap = col.charAt(0).toUpperCase() + col.slice(1);
    html = `
      <div class="popover-header">${cap} Sorting & Range</div>
      <button class="pop-btn" data-action="sort-col" data-col="${col}" data-dir="desc">↓ Sort highest → lowest</button>
      <button class="pop-btn" data-action="sort-col" data-col="${col}" data-dir="asc">↑ Sort lowest → highest</button>
      <hr>
      <div style="font-size:11px;font-weight:600;color:var(--fg-muted);padding:2px 4px;">FILTER BY RANGE</div>
      <div class="popover-row">
        <input type="number" id="pop-range-min" min="0" placeholder="Min" value="${min ?? ''}">
        <input type="number" id="pop-range-max" min="0" placeholder="Max" value="${max ?? ''}">
      </div>
      <div class="popover-actions">
        <button class="pop-apply-btn" data-action="apply-pop-range" data-col="${col}">Apply</button>
        <button class="pop-clear-btn" data-action="clear-pop-range" data-col="${col}">Clear</button>
      </div>
    `;
  }

  const el = document.createElement('div');
  el.className = 'popover';
  el.innerHTML = html;

  const popWidth = 230;
  const clampedX = Math.max(10, Math.min(x, window.innerWidth - popWidth - 10));
  el.style.top = `${y}px`;
  el.style.left = `${clampedX}px`;

  document.body.appendChild(el);
}

function showToast(msg) {
  const existing = $('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function exportToExcel(rows, filename) {
  try {
    const aoa = [
      ['Date', 'Page', 'Song', 'Views', 'Shares', 'Saves', 'TikTok URL'],
      ...rows.map(p => [p.date, p.page, p.song || '', p.views, p.shares, p.saves, p.tiktokUrl])
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);

    rows.forEach((p, idx) => {
      const cellRef = 'G' + (idx + 2);
      if (ws[cellRef]) {
        ws[cellRef].l = { Target: p.tiktokUrl, Tooltip: 'Open post on TikTok' };
      }
    });

    ws['!cols'] = [
      { wch: 14 },
      { wch: 24 },
      { wch: 20 },
      { wch: 12 },
      { wch: 12 },
      { wch: 12 },
      { wch: 65 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'TikTok Report');
    XLSX.writeFile(wb, filename);
    showToast(`Downloaded ${filename}`);
  } catch (err) {
    downloadCSV(rows, filename.replace('.xlsx', '.csv'));
  }
}

function downloadCSV(rows, filename) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const header = ['Date', 'Page', 'Song', 'Views', 'Shares', 'Saves', 'TikTok URL'];
  const lines = [
    header.map(q).join(','),
    ...rows.map(p => [p.date, p.page, p.song || '', p.views, p.shares, p.saves, p.tiktokUrl].map(q).join(','))
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function loadData() {
  S.loading = true;
  render();
  try {
    const [accounts, posts] = await Promise.all([fetchAccounts(), fetchPosts()]);
    if (accounts && accounts.length) S.accounts = accounts;
    if (posts && posts.length) S.posts = posts;
    S.at = new Date();
  } catch (err) {
    showToast('Loaded local TikTok report data.');
  }
  S.loading = false;
  render();
}

document.addEventListener('click', async e => {
  const trigger = e.target.closest('[data-action]');
  const isInsidePop = e.target.closest('.popover');
  const isInsideMenu = e.target.closest('.export-container');

  if (!trigger && !isInsidePop && !isInsideMenu) {
    if (S.pop || S.menu) {
      S.pop = null;
      S.menu = false;
      $('.popover')?.remove();
      render();
    }
    return;
  }

  if (!trigger) return;

  const act = trigger.dataset.action;
  const col = trigger.dataset.col;
  const dir = trigger.dataset.dir;
  const val = trigger.dataset.val;
  const f = S.f;

  if (act === 'open-popover') {
    const rect = trigger.getBoundingClientRect();
    if (S.pop && S.pop.col === col) {
      S.pop = null;
      $('.popover')?.remove();
    } else {
      S.pop = { col, x: rect.left, y: rect.bottom + 6 };
      drawPopover();
    }
    return;
  }

  if (act === 'sort-col') {
    S.sort = { key: col, dir };
    S.pop = null;
    S.pg = 1;
  } else if (act === 'pick-page') {
    f.page = val;
    S.pop = null;
    S.pg = 1;
  } else if (act === 'pick-song') {
    f.song = val;
    S.pop = null;
    S.pg = 1;
  } else if (act === 'apply-pop-date') {
    const fromEl = $('#pop-date-from');
    const toEl = $('#pop-date-to');
    f.from = fromEl ? fromEl.value : '';
    f.to = toEl ? toEl.value : '';
    S.pop = null;
    S.pg = 1;
  } else if (act === 'clear-pop-date') {
    f.from = '';
    f.to = '';
    S.pop = null;
    S.pg = 1;
  } else if (act === 'apply-pop-range') {
    const minEl = $('#pop-range-min');
    const maxEl = $('#pop-range-max');
    const minVal = minEl && minEl.value !== '' ? Number(minEl.value) : null;
    const maxVal = maxEl && maxEl.value !== '' ? Number(maxEl.value) : null;
    f.rng[col] = [minVal, maxVal];
    S.pop = null;
    S.pg = 1;
  } else if (act === 'clear-pop-range') {
    f.rng[col] = [null, null];
    S.pop = null;
    S.pg = 1;
  } else if (act === 'remove-chip') {
    const idx = Number(trigger.dataset.index);
    if (chipCallbacks[idx]) chipCallbacks[idx]();
    S.pg = 1;
  } else if (act === 'clear-all') {
    S.f = { from: '', to: '', page: '', song: '', rng: { views: [null, null], shares: [null, null], saves: [null, null] } };
    S.pg = 1;
  } else if (act === 'toggle-export') {
    S.menu = !S.menu;
    S.pop = null;
    $('.popover')?.remove();
  } else if (act === 'export-xlsx-all') {
    S.menu = false;
    exportToExcel(getSortedRows(S.posts), 'tiktok-report-all.xlsx');
  } else if (act === 'export-xlsx-filtered') {
    S.menu = false;
    exportToExcel(getSortedRows(getFilteredRows()), 'tiktok-report-filtered.xlsx');
  } else if (act === 'export-sheets') {
    S.menu = false;
    downloadCSV(getSortedRows(getFilteredRows()), 'tiktok-report-google-sheets.csv');
    showToast('Downloaded CSV for Google Sheets.');
  } else if (act === 'refresh') {
    S.loading = true;
    render();
    const res = await triggerRefresh();
    if (res.accounts && res.accounts.length) S.accounts = res.accounts;
    if (res.posts && res.posts.length) S.posts = res.posts;
    S.at = new Date();
    S.loading = false;
    render();
    showToast('Data refreshed successfully!');
    return;
  } else if (act === 'go-page') {
    S.pg = Number(trigger.dataset.page);
  } else if (act === 'prev-page') {
    if (S.pg > 1) S.pg--;
  } else if (act === 'next-page') {
    S.pg++;
  }

  $('.popover')?.remove();
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.pop || S.menu) {
      S.pop = null;
      S.menu = false;
      $('.popover')?.remove();
      render();
    }
  }
});

setInterval(() => {
  if (!S.loading && !S.pop && !S.menu) {
    loadData();
  }
}, CONFIG.pollMs);

loadData();
</script>

</html>
